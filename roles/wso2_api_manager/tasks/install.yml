# roles/wso2_api_manager/tasks/install.yml
---
- name: Télécharger l'archive WSO2 API Manager
  ansible.builtin.get_url:
    url: "{{ wso2_download_url }}"
    dest: "/tmp/wso2am-{{ wso2_version }}.zip"
    mode: '0644'
  register: wso2_download
  tags:
    - download

- name: Créer le répertoire d'installation WSO2
  ansible.builtin.file:
    path: "{{ wso2_home }}"
    state: directory
    owner: "{{ wso2_user }}"
    group: "{{ wso2_group }}"
    mode: '0755'

- name: Décompresser WSO2 API Manager
  ansible.builtin.unarchive:
    src: "/tmp/wso2am-{{ wso2_version }}.zip"
    dest: "{{ wso2_base_dir }}"
    remote_src: yes
    owner: "{{ wso2_user }}"
    group: "{{ wso2_group }}"
    creates: "{{ wso2_home }}/bin"
  tags:
    - install

- name: S'assurer des permissions sur le répertoire WSO2
  ansible.builtin.file:
    path: "{{ wso2_home }}"
    state: directory
    recurse: yes
    owner: "{{ wso2_user }}"
    group: "{{ wso2_group }}"

