# rulebooks/webhook_deploy.yml
---
- name: Deploy on webhook event
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Deploy WSO2 on push
      condition: event.payload.action is defined
      action:
        run_job_template:
          name: "WSO2 Deploy"
          organization: "Production"
